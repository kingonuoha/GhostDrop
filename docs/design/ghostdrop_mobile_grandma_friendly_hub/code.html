<script>
  const fileInput = document.getElementById('ghost-file-input');
  const pickFilesBtn = document.getElementById('pick-files-btn');
  const noteInput = document.getElementById('quick-note-input');
  const sendNoteBtn = document.getElementById('send-note-btn');

  pickFilesBtn?.addEventListener('click', () => {
    fileInput?.click();
  });

  fileInput?.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length > 0) {
      const fileName = e.target.files[0].name;
      const count = e.target.files.length;
      pickFilesBtn.querySelector('span:first-child').innerText = count > 1 ? `${count} Files Ready` : fileName;
      setTimeout(() => {
        pickFilesBtn.querySelector('span:first-child').innerText = 'Pick from Phone';
      }, 4000);
    }
  });

  sendNoteBtn?.addEventListener('click', () => {
    if (noteInput && noteInput.value.trim() !== '') {
      const originalText = noteInput.value;
      noteInput.value = '';
      noteInput.placeholder = 'Sent to computer!';
      setTimeout(() => {
        noteInput.placeholder = 'Paste or type a note...';
      }, 2500);
    }
  });
