<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GhostDrop - Send photos and text between your screens</title>
    <meta
      name="description"
      content="Send photos, files, and clipboard notes directly between your screens in seconds. Peer-to-peer, zero uploads, and everything vanishes when you say."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ghostdropapp.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn / Discord / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GhostDrop" />
    <meta property="og:url" content="https://ghostdropapp.vercel.app/" />
    <meta property="og:title" content="GhostDrop - Send photos and text between your screens" />
    <meta
      property="og:description"
      content="Send photos, files, and clipboard notes directly between your screens in seconds. Peer-to-peer, zero uploads, and everything vanishes when you say."
    />
    <meta property="og:image" content="https://ghostdropapp.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://ghostdropapp.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GhostDrop: Send photos and text between your screens. Instant P2P file teleportation."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ghostdropapp.vercel.app/" />
    <meta name="twitter:title" content="GhostDrop - Send photos and text between your screens" />
    <meta
      name="twitter:description"
      content="Send photos, files, and clipboard notes directly between your screens in seconds. Peer-to-peer, zero uploads, and everything vanishes when you say."
    />
    <meta name="twitter:image" content="https://ghostdropapp.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="GhostDrop: Send photos and text between your screens. Instant P2P file teleportation."
    />

    <meta name="theme-color" content="#CDF22B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/laroka.otf" as="font" type="font/otf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Semantic static fallback parsed by search crawlers and SEO auditors before JavaScript mounts -->
      <main
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 2rem;
          text-align: center;
          font-family: system-ui, -apple-system, sans-serif;
          background: #f7f6f2;
          color: #0d0f12;
        "
      >
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.75rem; max-width: 24ch;">
          GhostDrop - Send photos and text between your screens
        </h1>
        <h2 style="font-size: 1.15rem; font-weight: 600; color: #5a6270; margin-bottom: 1.5rem; max-width: 44ch;">
          Instant peer-to-peer file and clipboard teleportation that cleans up after itself
        </h2>
        <p style="font-size: 0.95rem; color: #5a6270; max-width: 50ch;">
          Send photos, files, and clipboard notes directly between your screens in seconds.
          Peer-to-peer, zero uploads, and everything vanishes when you say.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
